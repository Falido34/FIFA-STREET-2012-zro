name: Build FIFA Street Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-apk.yml'

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: windows-latest
    timeout-minutes: 360
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Require private game-files access token
        shell: pwsh
        env:
          GAME_FILES_TOKEN: ${{ secrets.GAME_FILES_TOKEN }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:GAME_FILES_TOKEN)) {
            throw "Configure the repository secret GAME_FILES_TOKEN with read access to Falido34/FIFA-STREET-2012-files. (private repository)"
          }

      - name: Download and validate game modules
        shell: pwsh
        env:
          GAME_FILES_TOKEN: ${{ secrets.GAME_FILES_TOKEN }}
        run: |
          # Fine-grained GitHub tokens are ASCII. Trim accidental whitespace from copy/paste.
          $token = $env:GAME_FILES_TOKEN.Trim()
          if ($token -match '[^\x21-\x7E]') {
            throw "GAME_FILES_TOKEN contains non-ASCII characters. Recreate the secret by copying the token directly from GitHub, without quotes or spaces."
          }
          $headers = @{
            Authorization = "Bearer $token"
            Accept = "application/octet-stream"
            "X-GitHub-Api-Version" = "2022-11-28"
          }
          $asset = "https://api.github.com/repos/Falido34/FIFA-STREET-2012-files./releases/assets/769518130"
          $zip = Join-Path $env:RUNNER_TEMP "fifa-street-build-inputs.zip"
          Invoke-WebRequest -Uri $asset -Headers $headers -OutFile $zip
          $hash = (Get-FileHash $zip -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($hash -ne "4925ddb6141b675f5fdf6774ce061bf7a5218603d6f00a2b0decb2c03763a24b") {
            throw "Game files ZIP SHA-256 mismatch: $hash"
          }
          $destination = Join-Path $env:GITHUB_WORKSPACE ".android-work/GameData"
          New-Item -ItemType Directory -Force -Path $destination | Out-Null
          Expand-Archive -LiteralPath $zip -DestinationPath $env:RUNNER_TEMP/fifa-input -Force
          $source = Join-Path $env:RUNNER_TEMP "fifa-input/GameData"
          if (!(Test-Path "$source/default.xex") -or !(Test-Path "$source/fifadllzf.xex.dll") -or !(Test-Path "$source/dlc/dlc_FootballCompEng/dlc/FootballCompEng/FootballCompEngzf.xex.dll")) {
            throw "The uploaded ZIP does not contain the expected GameData files."
          }
          Copy-Item "$source/*" $destination -Recurse -Force
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK and NDK
        uses: android-actions/setup-android@v3
      - name: Install pinned Android packages
        shell: pwsh
        run: |
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0" "ndk;28.2.13676358"

      - name: Set up MinGW GCC, CMake and Ninja
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: mingw-w64-x86_64-gcc mingw-w64-x86_64-cmake mingw-w64-x86_64-ninja

      - name: Prepare the exact tool paths expected by project scripts
        shell: pwsh
        run: |
          $tools = Join-Path $env:RUNNER_TEMP "fifa-tools"
          New-Item -ItemType Directory -Force -Path "$tools/jdk","$tools/android-sdk" | Out-Null
          New-Item -ItemType Junction -Path "$tools/jdk/jdk-17.0.20.1+1" -Target $env:JAVA_HOME | Out-Null
          New-Item -ItemType Junction -Path "$tools/android-sdk" -Target $env:ANDROID_HOME | Out-Null
          Copy-Item "C:/msys64/mingw64" "$tools/w64devkit" -Recurse -Force
          "FIFA_TOOLS=$tools" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Build ReXGlue runtime and host generator
        shell: pwsh
        run: ./android/BuildHostGenerator.ps1 -ToolsRoot "$env:FIFA_TOOLS" -Jobs 4

      - name: Generate FIFA Street modules and compile ARM64 Vulkan libraries
        shell: pwsh
        run: ./android/BuildGame.ps1 -ToolsRoot "$env:FIFA_TOOLS" -Jobs 4

      - name: Package, sign and verify APK
        shell: pwsh
        run: ./android/Build.ps1 -ToolsRoot "$env:FIFA_TOOLS"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: FIFA-STREET-Android-APK
          path: |
            dist/FIFA-STREET-0.1.apk
            dist/FIFA-STREET-0.1.apk.sha256
          if-no-files-found: error
          retention-days: 14
