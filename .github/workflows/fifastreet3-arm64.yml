name: Build FIFA Street 3 ARM64 (private input)

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fifa-street-3-arm64
  cancel-in-progress: false

jobs:
  build-fifastreet3:
    runs-on: windows-latest
    timeout-minutes: 360
    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK and NDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install pinned Android packages
        shell: pwsh
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0" "ndk;28.2.13676358"

      - name: Set up MinGW GCC, CMake and Ninja
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: mingw-w64-x86_64-gcc mingw-w64-x86_64-cmake mingw-w64-x86_64-ninja

      - name: Prepare build tools
        shell: pwsh
        run: |
          $tools = Join-Path $env:RUNNER_TEMP "fifa-tools"
          New-Item -ItemType Directory -Force -Path "$tools/jdk","$tools/android-sdk" | Out-Null
          New-Item -ItemType Junction -Path "$tools/jdk/jdk-17.0.20.1+1" -Target $env:JAVA_HOME | Out-Null
          New-Item -ItemType Junction -Path "$tools/android-sdk" -Target $env:ANDROID_HOME | Out-Null
          $msys2cmd = Join-Path $env:RUNNER_TEMP "setup-msys2/msys2.cmd"
          if (!(Test-Path -LiteralPath $msys2cmd)) { throw "MSYS2 launcher not found: $msys2cmd" }
          $mingwBin = (& $msys2cmd -c "cygpath -w /mingw64/bin" | Select-Object -Last 1).Trim()
          if ([string]::IsNullOrWhiteSpace($mingwBin) -or !(Test-Path -LiteralPath $mingwBin)) { throw "MINGW64 bin not found: $mingwBin" }
          $mingw = Split-Path -Parent $mingwBin
          $w64devkit = Join-Path $tools "w64devkit"
          New-Item -ItemType Junction -Path $w64devkit -Target $mingw | Out-Null
          "FIFA_TOOLS=$tools" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Download private FIFA Street 3 input
        shell: pwsh
        env:
          FIFA3_INPUT_TOKEN: ${{ secrets.FIFA3_INPUT_TOKEN }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:FIFA3_INPUT_TOKEN)) {
            throw "Missing secret FIFA3_INPUT_TOKEN. Add a fine-grained token with read-only Contents access to the private input repository."
          }
          $token = $env:FIFA3_INPUT_TOKEN.Trim()
          $headers = @{ Authorization = "Bearer $token"; Accept = "application/vnd.github+json"; "X-GitHub-Api-Version" = "2022-11-28" }
          $repo = "Falido34/FIFA-STREET-2012-input"
          $meta = Invoke-RestMethod -Headers $headers -Uri "https://api.github.com/repos/$repo"
          if ($meta.private -ne $true) { throw "Input repository must be PRIVATE. Refusing to download game files from a public repository." }
          $zipUrl = "https://api.github.com/repos/$repo/contents/4541083B.zip"
          $file = Invoke-RestMethod -Headers $headers -Uri $zipUrl
          if ($file.type -ne "file" -or !$file.download_url) { throw "4541083B.zip was not found at the root of the private input repository." }
          $zipPath = Join-Path $env:RUNNER_TEMP "4541083B.zip"
          Invoke-WebRequest -Headers $headers -Uri $file.download_url -OutFile $zipPath
          $gameData = Join-Path $env:GITHUB_WORKSPACE ".android-work/GameData"
          New-Item -ItemType Directory -Force -Path $gameData | Out-Null
          Expand-Archive -LiteralPath $zipPath -DestinationPath $gameData -Force
          if (!(Test-Path -LiteralPath (Join-Path $gameData "default.xex"))) {
            $nested = Get-ChildItem -LiteralPath $gameData -Filter default.xex -File -Recurse | Select-Object -First 1
            if (!$nested) { throw "ZIP does not contain default.xex." }
            $root = $nested.Directory.FullName
            Get-ChildItem -LiteralPath $root -Force | Copy-Item -Destination $gameData -Recurse -Force
          }
          $magic = [Text.Encoding]::ASCII.GetString([IO.File]::ReadAllBytes((Join-Path $gameData "default.xex"))[0..3])
          if ($magic -ne "XEX2") { throw "default.xex does not have a valid XEX2 signature." }
          Write-Output "Private input received and XEX2 header validated."

      - name: Build ReXGlue host generator
        shell: pwsh
        run: ./android/BuildHostGenerator.ps1 -ToolsRoot "$env:FIFA_TOOLS" -Jobs 4

      - name: Generate and compile FIFA Street 3 ARM64 library
        shell: pwsh
        run: ./android/BuildFifaStreet3.ps1 -GameData "$env:GITHUB_WORKSPACE/.android-work/GameData" -ToolsRoot "$env:FIFA_TOOLS" -Jobs 4

      - name: Upload native library and generation logs
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: FIFA-Street-3-ARM64-native
          path: |
            .android-work/build-fifastreet3-arm64/**/*.so
            .android-work/fifastreet3/codegen.log
            .android-work/fifastreet3/generated/**
          if-no-files-found: error
          retention-days: 7
