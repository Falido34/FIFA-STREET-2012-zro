name: Build FIFA Street 3 ARM64 (release input)

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fifa-street-3-arm64
  cancel-in-progress: false

jobs:
  build-fifastreet3:
    runs-on: windows-latest
    timeout-minutes: 360
    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK and NDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install pinned Android packages
        shell: pwsh
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0" "ndk;28.2.13676358"

      - name: Set up MinGW GCC, CMake and Ninja
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: mingw-w64-x86_64-gcc mingw-w64-x86_64-cmake mingw-w64-x86_64-ninja

      - name: Prepare build tools
        shell: pwsh
        run: |
          $tools = Join-Path $env:RUNNER_TEMP "fifa-tools"
          New-Item -ItemType Directory -Force -Path "$tools/jdk","$tools/android-sdk" | Out-Null
          New-Item -ItemType Junction -Path "$tools/jdk/jdk-17.0.20.1+1" -Target $env:JAVA_HOME | Out-Null
          New-Item -ItemType Junction -Path "$tools/android-sdk" -Target $env:ANDROID_HOME | Out-Null
          $msys2cmd = Join-Path $env:RUNNER_TEMP "setup-msys2/msys2.cmd"
          if (!(Test-Path -LiteralPath $msys2cmd)) { throw "MSYS2 launcher not found: $msys2cmd" }
          $mingwBin = (& $msys2cmd -c "cygpath -w /mingw64/bin" | Select-Object -Last 1).Trim()
          if ([string]::IsNullOrWhiteSpace($mingwBin) -or !(Test-Path -LiteralPath $mingwBin)) { throw "MINGW64 bin not found: $mingwBin" }
          $mingw = Split-Path -Parent $mingwBin
          $w64devkit = Join-Path $tools "w64devkit"
          New-Item -ItemType Junction -Path $w64devkit -Target $mingw | Out-Null
          "FIFA_TOOLS=$tools" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Download FIFA Street 3 input release
        shell: pwsh
        run: |
          $zipPath = Join-Path $env:RUNNER_TEMP "4541083B.zip"
          $url = "https://github.com/Falido34/FIFA-STREET-2012-files./releases/download/FIFA3/4541083B.zip"
          Invoke-WebRequest -Uri $url -OutFile $zipPath
          $gameData = Join-Path $env:GITHUB_WORKSPACE ".android-work/GameData"
          New-Item -ItemType Directory -Force -Path $gameData | Out-Null
          Expand-Archive -LiteralPath $zipPath -DestinationPath $gameData -Force
          if (!(Test-Path -LiteralPath (Join-Path $gameData "default.xex"))) {
            $nested = Get-ChildItem -LiteralPath $gameData -Filter default.xex -File -Recurse | Select-Object -First 1
            if (!$nested) { throw "ZIP does not contain default.xex." }
            Get-ChildItem -LiteralPath $nested.Directory.FullName -Force | Copy-Item -Destination $gameData -Recurse -Force
          }
          $xex = Join-Path $gameData "default.xex"
          $stream = [IO.File]::OpenRead($xex)
          try {
            $header = New-Object byte[] 4
            if ($stream.Read($header,0,4) -ne 4) { throw "default.xex is truncated." }
            if ([Text.Encoding]::ASCII.GetString($header) -ne "XEX2") { throw "default.xex does not have a valid XEX2 signature." }
          } finally { $stream.Dispose() }
          Write-Output "Release ZIP downloaded and XEX2 header validated."

      - name: Build ReXGlue host generator
        shell: pwsh
        run: ./android/BuildHostGenerator.ps1 -ToolsRoot "$env:FIFA_TOOLS" -Jobs 4

      - name: Generate and compile FIFA Street 3 ARM64 library
        shell: pwsh
        run: ./android/BuildFifaStreet3.ps1 -GameData "$env:GITHUB_WORKSPACE/.android-work/GameData" -ToolsRoot "$env:FIFA_TOOLS" -Jobs 4

      - name: Publish build privately
        if: success()
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.FIFA3_OUTPUT_TOKEN }}
        run: |
          $library = Get-ChildItem -LiteralPath ".android-work/build-fifastreet3-arm64" -Filter "libfifastreet3.so" -File -Recurse | Select-Object -First 1
          if (!$library) { throw "libfifastreet3.so was not produced." }
          $files = @($library.FullName)
          $log = ".android-work/fifastreet3/codegen.log"
          if (Test-Path -LiteralPath $log) { $files += (Resolve-Path -LiteralPath $log).Path }
          $tag = "fifa3-native-$env:GITHUB_RUN_NUMBER"
          gh release create $tag @files --repo "Falido34/FIFA-STREET-2012-output" --title "FIFA Street 3 native build $env:GITHUB_RUN_NUMBER" --notes "Private ARM64 build output. Generated game code and binaries are not published in the public source repository." --prerelease
          if ($LASTEXITCODE -ne 0) { throw "Could not publish the build to the private output repository." }
